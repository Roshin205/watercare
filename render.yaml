# Render Blueprint for WaterCare. Create it from the dashboard: New > Blueprint > pick this repo.
# On every start the app upgrades the database, creates/updates the admin from the ADMIN_* settings,
# and keeps uploaded files in the Supabase Storage bucket, so no disk is needed.
services:
  - type: web
    name: watercare
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true  # a long random value, created once by Render
      - key: STORAGE_PATH
        value: /tmp/uploads  # only used when the Supabase bucket settings below are missing
      - key: LOG_LEVEL
        value: INFO
      # Entered in the dashboard; never stored in git.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ACCESS_KEY
        sync: false
