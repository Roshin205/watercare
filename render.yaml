# Render Blueprint for WaterCare. Create it from the dashboard: New > Blueprint > pick this repo.
# The database is not created here: paste your Supabase "Session pooler" URL (or a Render PostgreSQL
# internal URL) when Render asks for DATABASE_URL.
services:
  - type: web
    name: watercare
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # a persistent disk and pre-deploy commands need a paid plan
    healthCheckPath: /api/health
    preDeployCommand: flask --app main:app db upgrade
    disk:
      name: watercare-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: STORAGE_PATH
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true  # a long random value, created once by Render
      - key: DATABASE_URL
        sync: false          # you enter this in the dashboard; it is never stored in git
      - key: LOG_LEVEL
        value: INFO
